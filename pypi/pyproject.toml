[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "talus-process-monitor"
version = "0.8.1.post1"
description = "Talus — eBPF ransomware detection & response for Linux (installer for the prebuilt agent binary)"
readme = "README-pypi.md"
requires-python = ">=3.8"
license = { text = "MIT" }
authors = [{ name = "Bartosz Osiej" }]
keywords = ["ebpf", "ransomware", "security", "linux", "edr", "detection", "incident-response"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: System Administrators",
  "License :: OSI Approved :: MIT License",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Topic :: Security",
]
[project.urls]
Homepage = "https://bartoszosiej.github.io/talus-process-monitor/"
Repository = "https://github.com/BartoszOsiej/talus-process-monitor"
Changelog = "https://bartoszosiej.github.io/talus-process-monitor/changelog.html"
Documentation = "https://bartoszosiej.github.io/talus-process-monitor/field-guide.html"
"Comparison" = "https://bartoszosiej.github.io/talus-process-monitor/comparison.html"
"Sponsor / Support" = "https://github.com/sponsors/BartoszOsiej"

[project.scripts]
talus-monitor = "talus_process_monitor:main"

[tool.setuptools]
packages = ["talus_process_monitor"]
