<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <title>talus logo v3</title>
  <defs>
    <radialGradient id="bg" cx="0.5" cy="0.38" r="0.85">
      <stop offset="0" stop-color="#1D2C4F"/>
      <stop offset="0.55" stop-color="#111C36"/>
      <stop offset="1" stop-color="#070C1A"/>
    </radialGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#FF5252" stop-opacity="0.9"/>
      <stop offset="0.6" stop-color="#E11D48" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#E11D48" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="core" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FF6B6B"/>
      <stop offset="1" stop-color="#B91C1C"/>
    </linearGradient>
    <linearGradient id="blade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#A5B4FC"/>
    </linearGradient>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="7"/>
    </filter>
    <filter id="soft2" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="14"/>
    </filter>
    <mask id="cut">
      <rect x="0" y="0" width="256" height="256" fill="white"/>
      <rect x="0" y="163" width="256" height="93" fill="black"/>
    </mask>
  </defs>

  <rect x="16" y="16" width="224" height="224" rx="52" fill="url(#bg)"/>

  <!-- living zone (above the blade) -->
  <g mask="url(#cut)">
    <circle cx="128" cy="118" r="66" fill="url(#glow)" filter="url(#soft2)"/>
    <circle cx="128" cy="118" r="40" fill="url(#core)" filter="url(#soft)" opacity="0.55"/>
    <circle cx="128" cy="118" r="34" fill="none" stroke="#FCA5A5" stroke-width="2.5" opacity="0.85"/>
    <circle cx="128" cy="118" r="46" fill="none" stroke="#F87171" stroke-width="1.6" opacity="0.5" stroke-dasharray="4 7"/>
    <circle cx="128" cy="118" r="20" fill="#FEE2E2" opacity="0.22"/>
    <circle cx="128" cy="118" r="7" fill="#FFF5F5"/>
    <!-- radar dots on ring -->
    <circle cx="128" cy="72"  r="3.4" fill="#FECACA"/>
    <circle cx="168" cy="140" r="3.4" fill="#FECACA" opacity="0.8"/>
    <circle cx="90"  cy="132" r="3.4" fill="#FECACA" opacity="0.65"/>
  </g>

  <!-- dead zone ghost (below the blade) -->
  <g opacity="0.16" mask="url(#cut)" transform="translate(0,90) scale(1,-1)" >
    <circle cx="128" cy="118" r="46" fill="none" stroke="#F87171" stroke-width="1.6" stroke-dasharray="4 7"/>
  </g>

  <!-- the blade -->
  <line x1="40" y1="163" x2="216" y2="163" stroke="#E0E7FF" stroke-width="10" stroke-linecap="round" filter="url(#soft)" opacity="0.9"/>
  <line x1="40" y1="163" x2="216" y2="163" stroke="url(#blade)" stroke-width="5" stroke-linecap="round"/>
  <path d="M216 163 L204 155 L204 171 Z" fill="#EEF2FF"/>
</svg>
