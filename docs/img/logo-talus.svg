<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <title>talus logo v4</title>
  <defs>
    <radialGradient id="bg" cx="0.5" cy="0.4" r="0.8">
      <stop offset="0" stop-color="#1C2B4E"/>
      <stop offset="0.6" stop-color="#101B34"/>
      <stop offset="1" stop-color="#080D1C"/>
    </radialGradient>
    <radialGradient id="halo" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#EF4444" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#EF4444" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="fade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff"/>
      <stop offset="0.62" stop-color="#fff"/>
      <stop offset="0.82" stop-color="#000"/>
    </linearGradient>
    <mask id="dissolve">
      <rect x="0" y="0" width="256" height="256" fill="url(#fade)"/>
    </mask>
    <linearGradient id="blade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#C7D2FE"/>
      <stop offset="0.5" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#C7D2FE"/>
    </linearGradient>
    <filter id="b6"><feGaussianBlur stdDeviation="6"/></filter>
    <filter id="b3"><feGaussianBlur stdDeviation="2.2"/></filter>
  </defs>

  <rect x="16" y="16" width="224" height="224" rx="52" fill="url(#bg)"/>
  <rect x="18.5" y="18.5" width="219" height="219" rx="50" fill="none" stroke="#FFFFFF" stroke-opacity="0.06" stroke-width="1.5"/>

  <!-- radar (dissolves smoothly below the blade — no hard cuts) -->
  <g mask="url(#dissolve)">
    <circle cx="128" cy="122" r="58" fill="url(#halo)"/>
    <g fill="none">
      <circle cx="128" cy="122" r="16" stroke="#FECACA" stroke-width="2.4" opacity="0.9"/>
      <circle cx="128" cy="122" r="30" stroke="#F87171" stroke-width="1.8" opacity="0.55"/>
      <circle cx="128" cy="122" r="44" stroke="#F87171" stroke-width="1.3" opacity="0.35"/>
      <circle cx="128" cy="122" r="58" stroke="#F87171" stroke-width="1"   opacity="0.18"/>
    </g>
    <circle cx="128" cy="122" r="5.5" fill="#FFF5F5"/>
    <!-- threats on the rings, each with a faint glow twin -->
    <g>
      <circle cx="150" cy="99"  r="5" fill="#EF4444" opacity="0.5" filter="url(#b3)"/><circle cx="150" cy="99"  r="3.4" fill="#FECACA"/>
      <circle cx="103" cy="139" r="5" fill="#EF4444" opacity="0.45" filter="url(#b3)"/><circle cx="103" cy="139" r="3.2" fill="#FECACA" opacity="0.9"/>
      <circle cx="155" cy="146" r="4.4" fill="#EF4444" opacity="0.4" filter="url(#b3)"/><circle cx="155" cy="146" r="2.8" fill="#FECACA" opacity="0.75"/>
      <circle cx="111" cy="95"  r="4.2" fill="#EF4444" opacity="0.35" filter="url(#b3)"/><circle cx="111" cy="95"  r="2.6" fill="#FECACA" opacity="0.6"/>
    </g>
  </g>

  <!-- kill line: short, confident, inside the safe area -->
  <line x1="80" y1="158" x2="176" y2="158" stroke="#818CF8" stroke-width="9" stroke-linecap="round" opacity="0.55" filter="url(#b6)"/>
  <line x1="80" y1="158" x2="176" y2="158" stroke="url(#blade)" stroke-width="3.6" stroke-linecap="round"/>
  <circle cx="176" cy="158" r="4.6" fill="#EEF2FF"/>
  <circle cx="176" cy="158" r="8"  fill="#C7D2FE" opacity="0.35" filter="url(#b3)"/>

  <!-- killed ghosts, fading down -->
  <g filter="url(#b3)">
    <circle cx="104" cy="184" r="2.8" fill="#F87171" opacity="0.30"/>
    <circle cx="128" cy="190" r="2.6" fill="#F87171" opacity="0.20"/>
    <circle cx="152" cy="184" r="2.8" fill="#F87171" opacity="0.30"/>
  </g>
</svg>
