[package]
name = "talus-keygen"
version = "0.1.0"
edition = "2021"
description = "License key generator for Talus Process Monitor"
license = "MIT"
license-file = "../LICENSE"
[[bin]]
name = "talus-keygen"
path = "src/main.rs"

[dependencies]
anyhow = "1"
base64 = "0.22"
chrono = "0.4"
clap = { version = "4.6", features = ["derive"] }
ed25519-dalek = { version = "2.1", features = ["rand_core"] }
hex = "0.4"
rand = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
