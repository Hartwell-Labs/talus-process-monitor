# gitleaks config — extend default rules, allowlist vendored third-party data
[extend]
useDefault = true

# One table, not an array of them. gitleaks 8.24 reads `allowlist`; the plural
# `[[allowlists]]` form is silently ignored by the version CI installs, which is
# why an entry there looked configured but never applied.
[allowlist]
  description = "Vendored third-party demo data and synthetic test fixtures — identifiers, not secrets"
  paths = [
    '''frankentui/ftui-demo-showcase/data/''',
    '''license-server/test/''',
  ]
  regexes = [
    # Stripe webhook fixtures. These sign test payloads and are committed on
    # purpose; a real key never appears in this tree.
    '''whsec_test_''',
    '''whsec_someone_elses_secret''',
  ]