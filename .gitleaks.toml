# gitleaks config — extend default rules, allowlist vendored third-party data
[extend]
useDefault = true

[allowlist]
  description = "Vendored third-party demo data (sqlite amalgamation etc.) — C identifiers, not secrets"
  paths = [
    '''frankentui/ftui-demo-showcase/data/''',
  ]

  [[allowlists]]
    description = "Stripe webhook test fixtures - synthetic secrets used to sign test payloads"
    paths = [
      'license-server/test/',
    ]
    regexes = [
      'whsec_test_',
      'whsec_someone_elses_secret',
    ]
