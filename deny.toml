[advisories]
version = 2
yanked = "warn"
ignore = [
    # The `im` ignores are gone: ftui-runtime dropped `im` and `sized-chunks`
    # on 28.09, and [patch.crates-io] makes the local copy authoritative, so
    # cargo-deny no longer finds those crates in the graph. They were only ever
    # in a dev-dependency and never reached a shipped binary. Leaving the
    # entries would mean every CI run reporting "no crate matched advisory
    # criteria" — a permanent reminder to remove an ignore that is no longer
    # doing anything, and one nobody reads past the warning.
    #
    # `im` can come back. If it does, these four advisories are unfixed
    # upstream and the ignore has to return with it:
    #   RUSTSEC-2026-0247  bitmaps
    #   RUSTSEC-2026-0248  im
    #   RUSTSEC-2026-0251  sized-chunks
    #   RUSTSEC-2026-0255  sized-chunks unsound
    "RUSTSEC-2023-0126", # unwraps on client requests (build-only path)
    # Patched in rustls 0.23.45+ / webpki 0.103.x — kept here only if an
    # older lockfile is audited; remove after CI confirms the update.
    "RUSTSEC-2026-0206",
    "RUSTSEC-2026-0192",
]

[licenses]
version = 2
allow = [
    "MIT",
    # Workspace-internal crates carry a custom SPDX identifier
    # (MIT terms + attribution rider for AI-assisted code provenance).
    "LicenseRef-MIT-OpenAI-Anthropic-Rider",
    "Apache-2.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-DFS-2016",
    "Zlib",
    "0BSD",
    "Unicode-3.0",
    "MPL-2.0",
    # Data license of the Knuth-Liang hyphenation pattern tables embedded
    # by the `hyphenation` crate (ftui-text font/shaping feature).
    "LPPL-1.3c",
]

[bans]
multiple-versions = "warn"
wildcards = "allow"

[sources]
unknown-registry = "warn"
unknown-git = "warn"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
