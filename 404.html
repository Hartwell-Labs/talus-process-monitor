<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="referrer" content="strict-origin-when-cross-origin">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data:">
<title>404 — Hartwell Labs</title>
<style>
:root{--ink:#101223;--bg:#ffffff;--accent:#4f46e5;--muted:#6b7280;--line:#e7e8f2;--mono:'JetBrains Mono',monospace}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Inter,system-ui,sans-serif;color:var(--ink);background:var(--bg);line-height:1.6}
.container{max-width:1080px;margin:0 auto;padding:0 24px}
header{border-bottom:1px solid var(--line)}
.header-in{display:flex;align-items:center;justify-content:space-between;height:60px}
.logo{display:flex;align-items:center;gap:9px;font-weight:700;text-decoration:none;color:var(--ink)}
.center{padding:110px 0;text-align:center}
.code{font-family:var(--mono);font-size:13px;letter-spacing:.14em;color:var(--accent);text-transform:uppercase}
h1{font-size:clamp(30px,5vw,44px);letter-spacing:-.03em;margin-top:12px}
p{color:var(--muted);margin-top:14px}
a.btn{display:inline-block;margin-top:26px;padding:11px 20px;border-radius:9px;font-size:14.5px;font-weight:600;text-decoration:none;background:var(--accent);color:#fff}
footer{border-top:1px solid var(--line);padding:30px 0;color:var(--muted);font-size:13.5px}
</style>
</head>
<body>
<header><div class="container header-in">
<a class="logo" href="/">
<svg width="22" height="22" viewBox="0 0 46 46" aria-hidden="true"><path d="M23,2 L42,13 L42,33 L23,44 L4,33 L4,13 Z" fill="none" stroke="#4f46e5" stroke-width="3.4" stroke-linejoin="round"/></svg>
Hartwell Labs</a>
</div></header>
<div class="container center">
<div class="code">Error 404</div>
<h1>Page not found.</h1>
<p>The page you are looking for does not exist — but our products do.</p>
<a class="btn" href="/">Back to hartwell-labs.github.io</a>
</div>
<footer><div class="container">© 2026 Hartwell Labs — Szczecin, Poland</div></footer>
</body>
</html>
