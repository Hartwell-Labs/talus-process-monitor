# Accepted RustSec advisories (cargo-audit v0.22 `[advisories].ignore`).
#
# rustybuzz 0.20.1 (RUSTSEC-2026-0206) and ttf-parser 0.25.1
# (RUSTSEC-2026-0192) are UNMAINTAINED upstream with no newer release.
# In this workspace they are reachable only through the vendored
# `frankentui/ftui-text` crate's OPTIONAL `shaping = ["dep:rustybuzz"]`
# feature — default off and NOT enabled by any workspace member. `cargo tree`
# cannot reach either crate from talus-monitor's runtime graph, so they are
# not compiled into the shipped talus-monitor binary (lockfile-only entries).
# Durable fix: swap ftui-text's shaping backend from `rustybuzz` to the
# maintained `allsorts` crate (vendor PR in frankentui/).

[advisories]
ignore = [
  "RUSTSEC-2026-0206",  # rustybuzz 0.20.1 — unmaintained
  "RUSTSEC-2026-0192",  # ttf-parser 0.25.1 — unmaintained
]
