[package]
repository = "https://github.com/BartoszOsiej/talus-process-monitor"
name = "talus-process-monitor"
version = "0.8.2"
edition = "2021"
description = "eBPF-based real-time process and file operation monitor with TUI"
license-file = "../LICENSE"
homepage = "https://bartoszosiej.github.io/talus-process-monitor/"
documentation = "https://bartoszosiej.github.io/talus-process-monitor/field-guide.html"
keywords = ["ebpf", "security", "ransomware", "monitoring", "edr"]
categories = ["os::linux-apis", "command-line-utilities", "development-tools::profiling"]
# Detection engine, exposed as a library so the paid modules can live in a
# separate crate that is not published. See src/lib.rs.
[lib]
name = "talus_process_monitor"
path = "src/lib.rs"

[[bin]]
name = "talus-monitor"
path = "src/main.rs"

[dependencies]
anyhow = "1"
aya = "0.14.0"
base64 = "0.23"
bytes = "1"
chrono = "0.4"
clap = { version = "4.6", features = ["derive"] }
colored = "3.1"
crossterm = "0.29"
dirs = "7"
ed25519-dalek = "3.0"
hostname = "0.4"
libc = "0.2"
reqwest = { version = "0.12", features = ["blocking", "json"] }
serde_json = "1"
serde = { version = "1", features = ["derive"] }
sha2 = "0.11"

hex = "0.4"
urlencoding = "2"

# FrankenTUI (path dependencies — full kernel)
ftui = { version = "0.6" }
ftui-core = { version = "0.6" }
ftui-render = { version = "0.6" }
ftui-runtime = { version = "0.6", features = ["crossterm-compat"] }
ftui-layout = { version = "0.6" }
ftui-style = { version = "0.6" }
ftui-text = { version = "0.6" }
ftui-widgets = { version = "0.6" }
ftui-extras = { version = "0.6", features = ["charts", "canvas", "text-effects"] }

# TLS for web dashboard

# hyper-util server builder for the TLS accept loop (axum enables only
# `server` + `service`; the `auto` conn builder additionally needs http1/http2)

[dev-dependencies]
criterion = { version = "0.8", features = ["html_reports"] }

[[bench]]
name = "event_throughput"
harness = false

[lints.clippy]
all = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
