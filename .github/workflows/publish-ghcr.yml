name: publish-ghcr

on:
  # Release tags only.
  #
  # This workflow builds an image, pushes it to GHCR and signs it with cosign,
  # so every run costs a keyless Fulcio ceremony plus a registry write.
  #
  # It used to fire on every push to every branch. With `type=raw,value=latest`
  # in the tag list that made `latest` track whichever commit landed last — so
  # "latest" was a race between branches, not a release. Tag-only fixes that:
  # `latest` now means "newest tagged release".
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to rebuild and re-publish (e.g. v0.8.3)'
        required: true

permissions: read-all

jobs:
  gate:
    # A signed image on GHCR is a durable public artifact. Re-run the checks
    # rather than trusting that CI passed on master: the tag and the release
    # commit can differ, and the tag's version can disagree with the manifest
    # (a `v1.0` tag exists in this repo while the manifest says 0.8.2).
    name: gate (version matches tag)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          persist-credentials: false
          # Without this the gate would compare the tag you asked for while the
          # build used whatever the default branch happened to hold — so a
          # rebuild would sign and push a different binary than the one it
          # claims to be rebuilding.
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || '' }}

      - name: Version in the repo matches the tag
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME#v}"
          manifest="$(grep -m1 '^version' process-monitor/Cargo.toml | sed 's/.*"\(.*\)".*/\1/')"
          echo "  tag:      $GITHUB_REF_NAME"
          echo "  manifest: $manifest"
          if [ "$tag" != "$manifest" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match process-monitor/Cargo.toml version $manifest — refusing to publish"
            exit 1
          fi

  build:
    needs: gate
    permissions:
      packages: write
      id-token: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@594f3bf4285d9ea8dc53c9a0c9c4092420091003  # v4.4.0
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9  # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302  # v6.2.0
        id: meta
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=ref,event=tag
            type=raw,value=latest
            type=sha
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc  # v7.4.0
        id: build
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
      - name: Install cosign
        uses: sigstore/cosign-installer@3454372f43399081ed03b604cb2d021dabca52bb  # v3.8.2
      - name: Sign image (keyless, Fulcio OIDC)
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          IMAGE=$(echo "$TAGS" | head -n1 | cut -d: -f1)
          cosign sign --yes --oidc-issuer https://token.actions.githubusercontent.com "${IMAGE}@${DIGEST}"
          echo "signed ${IMAGE}@${DIGEST}"
      - name: Verify signature
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          IMAGE=$(echo "$TAGS" | head -n1 | cut -d: -f1)
          cosign verify "${IMAGE}@${DIGEST}"             --certificate-identity-regexp "^https://github.com/${{ github.repository_owner }}/"             --certificate-oidc-issuer https://token.actions.githubusercontent.com
