name: publish-pypi

on:
  push:
    tags: ["v*"]

jobs:
  pypi:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pypi
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Build package
        run: |
          python -m pip install --upgrade build twine
          python -m build
          python -m twine check dist/*
      - name: Publish to PyPI
        # zizmor: ignore[use-trusted-publishing]
        # TODO: migrate to pypa/gh-action-pypi-publish (OIDC trusted publishing)
        # once the trusted publisher is configured on pypi.org for this repo.
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_API_KEY }}
        run: python -m twine upload dist/* --non-interactive
