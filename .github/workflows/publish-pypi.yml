name: publish-pypi

on:
  push:
    tags: ["v*"]

jobs:
  gate:
    # Publishing must not depend on someone remembering to run CI first.
    # This tag is pushed once; by the time a failure surfaces, the artifact is
    # already on PyPI and cannot be un-uploaded. So the checks that ci-ultra
    # runs on master are re-run here as a hard prerequisite.
    name: gate (fmt, clippy, test)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      RUSTFLAGS: "-D warnings"
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c  # stable
        with:
          components: rustfmt, clippy

      - name: Install cmake (required by rdkafka-sys build)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq cmake

      - name: Version in the repo matches the tag
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME#v}"
          manifest="$(grep -m1 '^version' process-monitor/Cargo.toml | sed 's/.*"\(.*\)".*/\1/')"
          echo "  tag:     v$tag"
          echo "  manifest: $manifest"
          if [ "$tag" != "$manifest" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match process-monitor/Cargo.toml version $manifest"
            exit 1
          fi

      - name: cargo fmt
        run: cargo fmt --all -- --check

      - name: cargo clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: cargo test
        run: cargo test --all-features

  pypi:
    needs: gate
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pypi
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Build package
        run: |
          python -m pip install --upgrade build twine
          python -m build
          python -m twine check dist/*
      - name: Publish to PyPI
        # zizmor: ignore[use-trusted-publishing]
        # TODO: migrate to pypa/gh-action-pypi-publish (OIDC trusted publishing)
        # once the trusted publisher is configured on pypi.org for this repo.
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_API_KEY }}
        # PyPI does not allow re-uploading a version. Without --skip-existing the
        # retry of a partially-failed release fails outright; with it, the
        # already-uploaded files are kept and only the missing ones are sent.
        run: python -m twine upload dist/* --non-interactive --skip-existing
