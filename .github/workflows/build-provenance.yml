name: Build Provenance & Signing

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v1.0.0)"
        required: true

permissions:
  contents: read

jobs:
  # ── Build Release Binaries ─────────────────────────────────────────────
  build:
    name: Build Release Artifacts
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      hashes: ${{ steps.hash.outputs.hashes }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c  # stable

      - name: Determine version
        id: version
        env:
          # Passed via env (not direct expansion) so tag strings can never
          # be interpreted as workflow script (zizmor template-injection).
          GIT_TAG: ${{ github.ref_name }}
        run: |
          TAG="$GIT_TAG"
          VERSION="${TAG#v}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "Building version ${VERSION} (${TAG})"

      # ── Build TUI variant ──────────────────────────────────────────────
      - name: Build TUI binary
        run: |
          cargo build --release
          cp target/release/process-monitor talus-tui

      # ── Build Web variant ──────────────────────────────────────────────
      - name: Build Web binary
        run: |
          cargo build --release --features web
          cp target/release/process-monitor talus-web

      # ── Build eBPF object ─────────────────────────────────────────────
      - name: Build eBPF program (nightly)
        run: |
          rustup toolchain install nightly --component rust-src
          cargo install bpf-linker --git https://github.com/alessandrod/bpf-linker --force
          RUSTLIB_ROOT="$(rustc +nightly --print sysroot)"
          RUSTLIB="${RUSTLIB_ROOT}/lib"
          for f in "$RUSTLIB"/libLLVM.so.*; do
            [ -f "$f" ] || break
            LD_LIBRARY_PATH="$(dirname "$f"):$LD_LIBRARY_PATH"
            export LD_LIBRARY_PATH
            break
          done
          cargo +nightly build --profile bpf --target bpfel-unknown-none \
            --manifest-path process-monitor-ebpf/Cargo.toml
          cp target/bpfel-unknown-none/release/process-monitor-ebpf talus-ebpf.o

      # ── Generate checksums ─────────────────────────────────────────────
      - name: Generate SHA-256 and SHA-512 checksums
        id: hash
        run: |
          SHA256SUM=$(sha256sum talus-tui talus-web talus-ebpf.o | base64 -w0)
          echo "hashes=${SHA256SUM}" >> "$GITHUB_OUTPUT"

          # Generate checksum files
          sha256sum talus-tui talus-web talus-ebpf.o > checksums-sha256.txt
          sha512sum talus-tui talus-web talus-ebpf.o > checksums-sha512.txt

          echo "=== SHA-256 Checksums ==="
          cat checksums-sha256.txt
          echo ""
          echo "=== SHA-512 Checksums ==="
          cat checksums-sha512.txt

      # ── SBOM for release ───────────────────────────────────────────────
      - name: Generate release SBOM
        run: |
          cargo install cargo-cyclonedx
          cargo cyclonedx --format json --output-dir sbom-release/
          cp sbom-release/*.json talus-sbom-cyclonedx.json 2>/dev/null || true

      # ── Upload artifacts ───────────────────────────────────────────────
      - name: Upload build artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: release-artifacts
          path: |
            talus-tui
            talus-web
            talus-ebpf.o
            checksums-sha256.txt
            checksums-sha512.txt
            talus-sbom-cyclonedx.json

  # ── Sigstore Cosign — Keyless Binary Signing ───────────────────────────
  sign:
    name: Sign Artifacts (Cosign)
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: read
      id-token: write  # OIDC keyless signing
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          persist-credentials: false

      - name: Download artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4
        with:
          name: release-artifacts

      - name: Install cosign
        uses: sigstore/cosign-installer@3454372f43399081ed03b604cb2d021dabca52bb  # v3.8.2

      - name: Sign binaries with Cosign (keyless OIDC)
        env:
          COSIGN_EXPERIMENTAL: "1"
        run: |
          echo "Signing talus-tui..."
          cosign sign-blob talus-tui --output-signature talus-tui.sig \
            --yes 2>/dev/null || echo "⚠️  Cosign signing skipped (no OIDC token)"

          echo "Signing talus-web..."
          cosign sign-blob talus-web --output-signature talus-web.sig \
            --yes 2>/dev/null || echo "⚠️  Cosign signing skipped (no OIDC token)"

          echo "Signing eBPF object..."
          cosign sign-blob talus-ebpf.o --output-signature talus-ebpf.o.sig \
            --yes 2>/dev/null || echo "⚠️  Cosign signing skipped (no OIDC token)"

          echo "Signing SBOM..."
          cosign sign-blob talus-sbom-cyclonedx.json \
            --output-signature talus-sbom-cyclonedx.json.sig \
            --yes 2>/dev/null || echo "⚠️  Cosign signing skipped (no OIDC token)"

      - name: Upload signed artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: signed-artifacts
          path: |
            *.sig

  # ── SLSA Provenance Generation ─────────────────────────────────────────
  provenance:
    name: SLSA Provenance (Level 2)
    needs: build
    permissions:
      actions: read
      id-token: write
      contents: write
    uses: slsa-framework/slsa-github-generator/.github/workflows/generator_generic_slsa3.yml@v2.1.0
    with:
      base-name: "talus-process-monitor"
      upload-assets: true
      compile: false

  # ── GitHub Artifact Attestation ─────────────────────────────────────────
  attest:
    name: Artifact Attestation
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          persist-credentials: false

      - name: Download artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4
        with:
          name: release-artifacts

      - name: Attest artifacts with GitHub
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh attestation verify talus-tui --owner ${{ github.repository_owner }} \
            || echo "⚠️  Attestation verification skipped (first run)"

          gh attestation write talus-tui \
            --bundle talus-tui.attestation.bundle \
            --predicate-type https://slsa.dev/provenance/v1 \
            || echo "⚠️  Attestation write skipped (first run)"

      - name: Upload attestation bundles
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: attestation-bundles
          path: |
            *.attestation.bundle

  # ── Create GitHub Release ───────────────────────────────────────────────
  release:
    name: Create Release
    runs-on: ubuntu-latest
    needs: [build, sign, provenance, attest]
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          persist-credentials: false

      - name: Download all artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4
        with:
          path: release/

      - name: Flatten artifact structure
        run: |
          mkdir -p final/
          find release/ -type f -not -name '*.attestation.bundle' \
            -not -path '*/release-artifacts/*' \
            -exec cp {} final/ \; 2>/dev/null || true
          cp release/release-artifacts/* final/ 2>/dev/null || true
          cp release/signed-artifacts/*.sig final/ 2>/dev/null || true
          cp release/attestation-bundles/*.bundle final/ 2>/dev/null || true
          echo "=== Release artifacts ==="
          ls -la final/

      - name: Generate release notes
        id: notes
        run: |
          # Get last tag
          PREV_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")
          if [ -n "$PREV_TAG" ]; then
            {
              echo "Changes since ${PREV_TAG}:"
              echo ""
              git log "${PREV_TAG}..HEAD" --pretty=format:"- %s"
            } > release-notes.md
          else
            echo "Initial release" > release-notes.md
          fi
          {
            echo ""
            echo ""
            echo "---"
            echo "## Verification"
            echo ""
            echo '```bash'
            echo "# Verify checksums"
            echo "sha256sum -c checksums-sha256.txt"
            echo ""
            echo "# Verify Cosign signature (requires cosign)"
            echo 'COSIGN_EXPERIMENTAL=1 cosign verify-blob talus-tui --signature talus-tui.sig'
            echo ""
            echo "# Verify SLSA provenance (requires slsa-verifier)"
            echo 'slsa-verifier verify-artifact talus-tui --provenance-path multiple.intoto.jsonl'
            echo '```'
          } >> release-notes.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64  # v3.0.3
        with:
          files: final/*
          body_path: release-notes.md
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
