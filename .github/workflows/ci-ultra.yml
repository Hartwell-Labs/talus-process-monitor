name: Ultra CI

on:
  push:
    branches: [master, main]
  pull_request:

concurrency:
  group: ultra-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  # ── SYNTAX ──────────────────────────────────────────────────
  fmt:
    permissions:
      security-events: write
    name: fmt (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c  # stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  # ── RUST ────────────────────────────────────────────────────
  clippy:
    permissions:
      security-events: write
    name: clippy (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@7c8d7d138f5c09cef361f8214cf96882cd029cdb
        with:
          # Pinned: latest nightly regularly breaks bpf-linker/clippy builds
          # (see ebpf job). Move all three pins together.
          toolchain: nightly-2026-08-15
          components: clippy
      - run: cargo +nightly-2026-08-15 clippy --all-targets --all-features -- -D warnings

  # ── TESTY ───────────────────────────────────────────────────
  test:
    permissions:
      security-events: write
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c  # stable
      - run: cargo test --all-features --verbose

  # ── eBPF build ──────────────────────────────────────────────
  ebpf:
    permissions:
      security-events: write
    name: ebpf-build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@7c8d7d138f5c09cef361f8214cf96882cd029cdb
        with:
          toolchain: nightly-2026-08-15
          components: rust-src
      - name: Install bpf-linker (from source, matches nightly LLVM)
        run: cargo install bpf-linker --git https://github.com/alessandrod/bpf-linker --force
      - name: Fix libLLVM symlink (nightly linker scripts)
        run: |
          RUSTLIB_ROOT="$(rustc --print sysroot)"
          RUSTLIB="${RUSTLIB_ROOT}/lib"
          for f in "$RUSTLIB"/libLLVM-*-rust-*.so; do
            [ -f "$f" ] || continue
            SIZE="$(stat -c%s "$f" 2>/dev/null || echo 999999)"
            if [ "$SIZE" -lt 1024 ] 2>/dev/null; then
              REAL="$(grep -oP '(?<=INPUT\()[^)]+' "$f" 2>/dev/null || true)"
              if [ -n "$REAL" ] && [ -f "$RUSTLIB/$REAL" ]; then
                mv "$f" "${f}.script"
                ln -s "$REAL" "$f"
              fi
            fi
          done
      - name: Build eBPF (bpfel-unknown-none)
        run: |
          RUSTLIB_ROOT="$(rustc --print sysroot)"
          RUSTLIB="${RUSTLIB_ROOT}/lib"
          for f in "$RUSTLIB"/libLLVM.so.*; do
            [ -f "$f" ] || break
            LD_LIBRARY_PATH="$(dirname "$f"):$LD_LIBRARY_PATH"
            export LD_LIBRARY_PATH
            break
          done
          cargo +nightly-2026-08-15 build --profile bpf --target bpfel-unknown-none -Z build-std=core --manifest-path process-monitor-ebpf/Cargo.toml

  # ── MIRI ────────────────────────────────────────────────────
  miri:
    permissions:
      security-events: write
    name: miri
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@7c8d7d138f5c09cef361f8214cf96882cd029cdb
        with:
          toolchain: nightly-2026-08-15
          components: miri
      - run: cargo +nightly-2026-08-15 miri setup
      - run: cargo +nightly-2026-08-15 miri test
        env:
          # disable-isolation: some tests read directory listings (opendir);
          # that is filesystem access, not undefined behaviour.
          MIRIFLAGS: "-Zmiri-ignore-leaks -Zmiri-disable-isolation"

  # ── SECURITY ────────────────────────────────────────────────
  audit:
    permissions:
      security-events: write
    name: cargo-audit
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c  # stable
      - run: cargo install cargo-audit --locked
      # Vulnerabilities always fail the run. Informational unmaintained/
      # unsound/yanked warnings are governed by audit.toml (cargo-audit 0.22
      # `-D warnings` would override the ignore list, so it is not used).
      - run: cargo audit

  deny:
    permissions:
      security-events: write
    name: cargo-deny
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          persist-credentials: false
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25  # v2
        with:
          command: check all

  typos:
    permissions:
      security-events: write
    name: typos
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          persist-credentials: false
      - uses: crate-ci/typos@12ffd4a04b4893ab75db66a59aaad2d996c3e982  # v1

  zizmor:
    permissions:
      security-events: write
    name: zizmor (GH Actions security)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          persist-credentials: false
      # exit 13 = findings found; the single medium (use-trusted-publishing in
      # publish-pypi.yml) is tracked as a TODO until the PyPI trusted publisher
      # is configured — do not fail the whole pipeline on it.
      - run: |
          pip install zizmor
          if ! zizmor . --no-exit-codes; then
            echo "::warning::zizmor reported findings (tracked TODO: trusted publishing)"
          fi

  actionlint:
    permissions:
      security-events: write
    name: actionlint
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          persist-credentials: false
      - uses: raven-actions/actionlint@3d39aea434753780c3b3d4a1a31c854b4dbf49d7  # v2.2.0
# Ultra CI
