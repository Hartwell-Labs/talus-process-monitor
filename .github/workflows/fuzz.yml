name: Fuzz

on:
  push:
    branches: [main, master]
  pull_request:
    paths:
      - "fuzz/**"
      - "process-monitor/src/memlp.rs"
      - "process-monitor/src/monitor.rs"
  schedule:
    - cron: "0 4 * * 1"

permissions: read-all

jobs:
  fuzz:
    name: Fuzz
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          persist-credentials: false
      # cargo-fuzz needs a nightly toolchain (sanitizer flags). The previous
      # job used stable and swallowed the failure with `|| true`, so it never
      # actually fuzzed anything. Pin matches ci-ultra.yml; move them together.
      - uses: dtolnay/rust-toolchain@7c8d7d138f5c09cef361f8214cf96882cd029cdb
        with:
          toolchain: nightly-2026-08-15
      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz --locked
      - name: Run fuzz targets
        run: |
          cd fuzz
          for target in fuzz_memlp_checkpoint fuzz_event_decode; do
            echo "::group::$target"
            cargo +nightly-2026-08-15 fuzz run "$target" -- -max_total_time=60
            echo "::endgroup::"
          done
      - name: Upload crash artifacts
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: fuzz-artifacts
          path: fuzz/artifacts/
          if-no-files-found: ignore
