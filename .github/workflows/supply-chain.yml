name: Supply Chain Security

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

permissions:
  contents: read

jobs:
  # ── License & Advisory Audit (cargo-deny) ──────────────────────────────
  cargo-deny:
    name: License & Advisory Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          persist-credentials: false
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25  # v2
        with:
          command: check licenses
          arguments: --all-features
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25  # v2
        with:
          command: check advisories
          arguments: --all-features

  # ── SBOM Generation (CycloneDX) ────────────────────────────────────────
  sbom:
    name: Generate SBOM
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c  # stable
      - name: Install cargo-cyclonedx
        run: cargo install cargo-cyclonedx
      - name: Generate SBOM
        run: |
          # cargo-cyclonedx has no --output-dir; it writes next to the
          # manifest, so target the userspace crate and collect the files.
          mkdir -p sbom/
          cargo cyclonedx --manifest-path process-monitor/Cargo.toml --format json
          cargo cyclonedx --manifest-path process-monitor/Cargo.toml --format xml
          find . \( -name '*.cdx.json' -o -name '*.cdx.xml' \) -exec cp -t sbom/ {} +
      - name: Verify SBOM
        run: |
          echo "=== CycloneDX JSON SBOM ==="
          ls -la sbom/*.json 2>/dev/null || echo "No JSON SBOM found"
          echo "=== CycloneDX XML SBOM ==="
          ls -la sbom/*.xml 2>/dev/null || echo "No XML SBOM found"
          # Validate JSON structure
          python3 -c "
          import json, sys
          for f in __import__('glob').glob('sbom/*.json'):
              with open(f) as fh:
                  data = json.load(fh)
                  assert 'bomFormat' in data, f'{f}: missing bomFormat'
                  assert data['bomFormat'] == 'CycloneDX', f'{f}: not CycloneDX'
                  print(f'✅ {f}: valid CycloneDX SBOM ({len(data.get(\"components\", []))} components)')
          " 2>/dev/null || echo "⚠️  Python validation skipped"
      - name: Upload SBOM artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: sbom
          path: sbom/
          retention-days: 90

  # ── Secret Scanning (gitleaks CLI — no org license needed) ─────────────
  secret-scan:
    name: Secret Scanning
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Install gitleaks
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.24.3/gitleaks_8.24.3_linux_x64.tar.gz -o gitleaks.tgz
          tar -xzf gitleaks.tgz gitleaks && sudo mv gitleaks /usr/local/bin/
      - name: Run gitleaks
        run: gitleaks detect --source . --verbose --redact --exit-code 1

  # ── Dependency Review ───────────────────────────────────────────────────
  dep-review:
    name: Dependency Review
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/dependency-review-action@da24556b548a50705dd671f47852072ea4c105d9  # v4
        with:
          fail-on-severity: high
          comment-summary-in-pr: always
