[package]
name = "talus-process-monitor-fuzz"
version = "0.0.0"
license = "MIT"
edition = "2021"
publish = false

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
talus-process-monitor = { path = "../process-monitor" }

# Standalone workspace (the root workspace excludes this crate). The root
# [patch.crates-io] table does not apply here, so it is repeated: without it the
# fuzz build would pull FrankenTUI from crates.io instead of the vendored copy.
[workspace]

[patch.crates-io]
ftui = { path = "../frankentui/ftui" }
ftui-a11y = { path = "../frankentui/ftui-a11y" }
ftui-backend = { path = "../frankentui/ftui-backend" }
ftui-core = { path = "../frankentui/ftui-core" }
ftui-extras = { path = "../frankentui/ftui-extras" }
ftui-i18n = { path = "../frankentui/ftui-i18n" }
ftui-layout = { path = "../frankentui/ftui-layout" }
ftui-render = { path = "../frankentui/ftui-render" }
ftui-runtime = { path = "../frankentui/ftui-runtime" }
ftui-style = { path = "../frankentui/ftui-style" }
ftui-text = { path = "../frankentui/ftui-text" }
ftui-widgets = { path = "../frankentui/ftui-widgets" }

[[bin]]
name = "fuzz_memlp_checkpoint"
path = "fuzz_targets/fuzz_memlp_checkpoint.rs"
test = false
doc = false

[[bin]]
name = "fuzz_event_decode"
path = "fuzz_targets/fuzz_event_decode.rs"
test = false
doc = false
