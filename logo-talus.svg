<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <title>talus logo</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B1220"/>
      <stop offset="1" stop-color="#16233B"/>
    </linearGradient>
    <linearGradient id="red" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F87171"/>
      <stop offset="1" stop-color="#DC2626"/>
    </linearGradient>
  </defs>
  <rect x="16" y="16" width="224" height="224" rx="48" fill="url(#bg)"/>
  <!-- encrypted files: two top rows infected -->
  <g>
    <rect x="58"  y="62" width="36" height="36" rx="7" fill="url(#red)"/>
    <rect x="110" y="62" width="36" height="36" rx="7" fill="url(#red)" opacity="0.92"/>
    <rect x="162" y="62" width="36" height="36" rx="7" fill="url(#red)" opacity="0.84"/>
    <rect x="58"  y="112" width="36" height="36" rx="7" fill="url(#red)" opacity="0.92"/>
    <rect x="110" y="112" width="36" height="36" rx="7" fill="url(#red)" opacity="0.84"/>
    <rect x="162" y="112" width="36" height="36" rx="7" fill="url(#red)" opacity="0.76"/>
  </g>
  <!-- killed row: outline only -->
  <g fill="none" stroke="#3B4A63" stroke-width="3">
    <rect x="58"  y="162" width="36" height="36" rx="7"/>
    <rect x="110" y="162" width="36" height="36" rx="7"/>
    <rect x="162" y="162" width="36" height="36" rx="7"/>
  </g>
  <!-- the kill line -->
  <line x1="44" y1="155" x2="212" y2="155" stroke="#F8FAFC" stroke-width="7" stroke-linecap="round"/>
  <circle cx="212" cy="155" r="6" fill="#F8FAFC"/>
</svg>
