# ── Talus License Server — FAILOVER deployment (same code, shared Turso) ──
#
# Secondary activation server. Identical API surface to the primary worker,
# but storage is the shared Turso (libSQL) database instead of D1 — selected
# automatically by src/db.js because this deployment has NO `DB` binding.
#
# Primary:   wrangler.toml            → Cloudflare Worker + D1 (authoritative)
# Failover:  wrangler.failover.toml   → Cloudflare Worker + Turso over HTTP
#
# Deploy:
#   npx wrangler deploy -c wrangler.failover.toml
#   npx wrangler secret put ADMIN_TOKEN -c wrangler.failover.toml
#   npx wrangler secret put TOTP_SECRET -c wrangler.failover.toml
#   npx wrangler secret put TURSO_AUTH_TOKEN -c wrangler.failover.toml
#
# NOTE: this failover runs on the SAME Cloudflare account as the primary
# (free tier). It removes the D1/Worker-runtime single point of failure, but
# the account itself remains shared. Moving to a second Cloudflare account is
# a config-only change: deploy this same file with the other account's
# CLOUDFLARE_API_TOKEN and re-set the three secrets (docs/ops.md).
#
# TURSO_DATABASE_URL is a public (non-secret) URL; the auth token is a secret.

name = "talus-license-failover"
main = "src/index.js"
compatibility_date = "2026-09-01"

rules = [
  { type = "Text", globs = ["**/*.html", "**/*.css"], fallthrough = true },
  { type = "Text", globs = ["**/admin-assets/*.js"], fallthrough = true },
]

[observability]
enabled = false

[vars]
# Multi-key support — see primary wrangler.toml for details.
LICENSE_PUBLIC_KEYS = "v1:850e6bbdc5b5d66ae24973cef9e6e5baf887b2c775a2e17cd1b6cd2d8ae76845,v2:e1e98f159d34f54b4c51f23e53a49c658c87deecf5ac5218e04ed644f6901306"
TURSO_DATABASE_URL = "https://talus-licenses-bartoszosiej.aws-eu-west-1.turso.io"
